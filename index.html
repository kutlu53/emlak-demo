<!DOCTYPE html>
<html lang="tr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/emlak-demo/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="YMG Yönetim Paneli — Better Homes and Gardens Real Estate YMG için ciro, danışman, müşteri ve hedef takibi.">
  <meta name="theme-color" content="#2E7D2E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="YMG Panel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>YMG Yönetim Paneli</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Markalı açılış ekranı: CanvasKit + main.dart.js inerken beyaz sayfa
       yerine YMG yeşili ve logo görünür; Flutter ilk kareyi çizince kalkar. -->
  <style>
    #ymg-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #2E7D2E; color: #fff;
      font-family: 'Segoe UI', Roboto, sans-serif;
      transition: opacity .3s ease-out;
    }
    #ymg-splash .marka { font-size: 44px; font-weight: 700; letter-spacing: 2px; }
    #ymg-splash .alt { margin-top: 6px; font-size: 14px; opacity: .85; }
    #ymg-splash .halka {
      margin-top: 28px; width: 28px; height: 28px;
      border: 3px solid rgba(255,255,255,.35); border-top-color: #fff;
      border-radius: 50%; animation: ymgdon 0.9s linear infinite;
    }
    @keyframes ymgdon { to { transform: rotate(360deg); } }
  </style>
  <div id="ymg-splash">
    <div class="marka">YMG</div>
    <div class="alt">Yönetim Paneli yükleniyor…</div>
    <div class="halka"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('ymg-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 350);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
